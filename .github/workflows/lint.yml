name: Lint & Type Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # No 'version': the action reads the packageManager field from package.json,
        # which is what keeps CI and local machines on the same pnpm version.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint
        working-directory: artifacts/portfolio

      - name: Run type check
        run: pnpm run typecheck
        working-directory: artifacts/portfolio

      - name: Run tests
        run: pnpm run test
        working-directory: artifacts/portfolio
