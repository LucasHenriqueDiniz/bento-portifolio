name: Lint & Type Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Sem 'version': a action lê o campo packageManager do package.json, que é
        # o que mantém o CI e as máquinas locais na mesma versão de pnpm.
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run linter
        run: pnpm run lint
        working-directory: artifacts/portfolio

      - name: Run type check
        run: pnpm run typecheck
        working-directory: artifacts/portfolio

      - name: Run tests
        run: pnpm run test
        working-directory: artifacts/portfolio
