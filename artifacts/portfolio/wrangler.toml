name = "lucashdo-portfolio"
compatibility_date = "2026-05-04"
pages_build_output_dir = "dist/public"

[[kv_namespaces]]
binding = "PORTFOLIO_CACHE"
id = "7148bef2a0a64d8398ad94a9a04ca4be"

# Direct read of daily-ingest telemetry (PC + server). SELECTs only.
[[d1_databases]]
binding = "DAILY_INGEST_DB"
database_name = "daily-ingest"
database_id = "28f0e5fd-3e16-42d2-8108-f421645301d6"

# The portfolio's own database: the visitor counter, which needs an atomic increment.
[[d1_databases]]
binding = "PORTFOLIO_DB"
database_name = "lucashdo-portfolio"
database_id = "157853ec-5fb2-4ceb-a753-9fde77d4d4ae"
migrations_dir = "migrations"
